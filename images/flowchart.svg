<svg width="680" height="810" viewBox="0 0 680 810" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Task 4 flowchart: temperature alert and relay auto-off logic</title>
<desc>Flowchart showing the loop that reads temperature, decides whether to alert via Telegram, turns the relay on when /on is received, and automatically turns it off with a one-time notice when temperature drops below 25 degrees.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#333333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="810" fill="#ffffff"/>

<!-- Start -->
<rect x="270" y="20" width="140" height="44" rx="22" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2c2c2a">Start</text>
<line x1="340" y1="64" x2="340" y2="98" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Read T & humidity -->
<rect x="230" y="100" width="220" height="56" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
<text x="340" y="122" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#0c447c">Read T &amp; humidity</text>
<text x="340" y="144" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185fa5">Every 5 seconds</text>
<line x1="340" y1="156" x2="340" y2="194" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Diamond A -->
<polygon points="340,196 440,256 340,316 240,256" fill="#faeeda" stroke="#854f0b" stroke-width="1"/>
<text x="340" y="256" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#633806">T &#8805; 25&#176;C?</text>
<text x="195" y="244" text-anchor="middle" font-size="12" fill="#5f5e5a">No</text>
<text x="485" y="244" text-anchor="middle" font-size="12" fill="#5f5e5a">Yes</text>

<path d="M240 256 L140 256 L140 319" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M440 256 L540 256 L540 319" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Diamond B: Relay ON? -->
<polygon points="140,321 225,381 140,441 55,381" fill="#faeeda" stroke="#854f0b" stroke-width="1"/>
<text x="140" y="381" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#633806">Relay ON?</text>

<!-- Diamond C: Relay OFF? -->
<polygon points="540,321 625,381 540,441 455,381" fill="#faeeda" stroke="#854f0b" stroke-width="1"/>
<text x="540" y="381" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#633806">Relay OFF?</text>

<text x="35" y="368" text-anchor="middle" font-size="12" fill="#5f5e5a">No</text>
<text x="645" y="368" text-anchor="middle" font-size="12" fill="#5f5e5a">No</text>
<text x="168" y="458" text-anchor="start" font-size="12" fill="#5f5e5a">Yes</text>
<text x="512" y="458" text-anchor="end" font-size="12" fill="#5f5e5a">Yes</text>

<line x1="140" y1="441" x2="140" y2="474" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="540" y1="441" x2="540" y2="474" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M55 381 L15 381" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M625 381 L655 381" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Box E: Turn relay OFF + auto-off notice -->
<rect x="40" y="476" width="200" height="70" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
<text x="140" y="500" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#0c447c">Turn relay OFF</text>
<text x="140" y="524" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185fa5">Send auto-OFF notice</text>

<!-- Box F: Send alert -->
<rect x="440" y="476" width="200" height="44" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="1"/>
<text x="540" y="498" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#712b13">Send alert to Telegram</text>

<line x1="540" y1="520" x2="540" y2="553" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Diamond D: /on received? -->
<polygon points="540,555 625,615 540,675 455,615" fill="#faeeda" stroke="#854f0b" stroke-width="1"/>
<text x="540" y="615" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#633806">/on received?</text>
<text x="645" y="602" text-anchor="middle" font-size="12" fill="#5f5e5a">No</text>
<text x="512" y="692" text-anchor="end" font-size="12" fill="#5f5e5a">Yes</text>

<path d="M625 615 L655 615" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="540" y1="675" x2="540" y2="708" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Box G: Turn relay ON, stop alerts -->
<rect x="440" y="710" width="200" height="56" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
<text x="540" y="730" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#0c447c">Turn relay ON</text>
<text x="540" y="752" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185fa5">Stop sending alerts</text>

<path d="M140 546 L15 546" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M540 766 L655 766" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Feedback channels back into Read T & humidity -->
<path d="M15 546 L15 128 L228 128" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M15 381 L15 546" fill="none" stroke="#333333" stroke-width="1.2"/>
<path d="M655 381 L655 128 L452 128" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M655 615 L655 128" fill="none" stroke="#333333" stroke-width="1.2"/>
<path d="M655 766 L655 128" fill="none" stroke="#333333" stroke-width="1.2"/>

</svg>
